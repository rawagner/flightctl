{{ if eq .Values.global.target "acm" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    flightctl.service: flightctl-api
  name: flightctl-api
subjects:
  - kind: ServiceAccount
    name: flightctl-api
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: flightctl-api
  apiGroup: rbac.authorization.k8s.io
{{ end }}